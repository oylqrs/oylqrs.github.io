<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文档站点</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4.13.0/lib/themes/vue.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css">
  <style>
    /* 全屏顶部导航 */
    .top-nav-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      display:flex;
      gap:24px;
      padding:12px 24px;
      background:#2c3e50;
      z-index:999;
    }
    .top-nav-bar a {
      color:#fff;
      text-decoration:none;
      font-size: 16px;
    }

    /* 侧边栏整体下移，重点！避开顶部导航，防止折叠按钮被遮挡 */
    .sidebar {
      margin-top: 64px !important;
    }
    /* 主内容区域下移 */
    .content {
      margin-top: 64px !important;
    }
    /* 右上角导航位置适配 */
    .app-nav {
      top: 14px !important;
    }
  </style>
</head>
<body>
  <!-- 固定顶部通栏导航 -->
  <div class="top-nav-bar">
    <a href="#/">首页</a>
    <a href="#/guide/PassManager/">PassManager文档</a>
  </div>

  <div id="app"></div>

  <script>
    window.$docsify = {
      name: '项目文档',
      repo: '',
      loadSidebar: true,
      loadNavbar: true,
      subMaxLevel: 0,
      cache: false,
      search: {
        placeholder: '搜索文档'
      }
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.0/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.0/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/js/docsify-themeable.min.js"></script>
</body>
</html>
