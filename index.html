<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文档站点</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4.13.0/lib/themes/vue.css">
  <style>
    /* 全局顶部导航 */
    .top-nav-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      display:flex;
      gap:24px;
      padding:12px 24px;
      background:#2c3e50;
      z-index:999;
    }
    .top-nav-bar a {
      color:#fff;
      text-decoration:none;
      font-size: 16px;
    }
    /* 侧边栏下移，避开顶部导航，解决折叠按钮遮挡 */
    .sidebar {
      margin-top: 64px !important;
    }
    .content {
      margin-top: 64px !important;
    }
    .app-nav {
      top: 14px !important;
    }

    /* ===== 自定义明暗模式样式 ===== */
    html.dark {
      --text-color: #e6e6e6;
      --bg-color: #1a1a1a;
      --sidebar-bg: #242424;
      --border-color: #333;
    }
    html.dark body {
      background-color: var(--bg-color);
      color: var(--text-color);
    }
    html.dark .sidebar {
      background: var(--sidebar-bg);
    }
    html.dark .content {
      background: var(--bg-color);
    }
    /* 切换按钮样式 */
 
    .mode-toggle {
      cursor: pointer;
      user-select: none;
      color:#fff;
      margin-left:auto; /* 推到最右侧 */
    }
  </style>
</head>
<body>
  <!-- 顶部固定导航 -->
  <div class="top-nav-bar">
    <a href="#/">首页</a>
    <a href="#/guide/PassManager/">PassManager文档</a>
    <!-- 明暗切换按钮，放在顶部导航，永远可见，不会消失！ -->
    <span class="mode-toggle" id="modeBtn">🌙 深色模式</span>
  </div>

  <div id="app"></div>

  <script>
    window.$docsify = {
      name: '项目文档',
      repo: '',
      loadSidebar: true,
      loadNavbar: true,
      subMaxLevel: 0,
      cache: false,
      search: {
        placeholder: '搜索文档'
      }
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.0/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.0/lib/plugins/search.min.js"></script>
 <!-- Gitalk CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gitalk@1.8.0/dist/gitalk.css">
<script src="https://cdn.jsdelivr.net/npm/gitalk@1.8.0/dist/gitalk.min.js"></script>

<script>
// 解决中文/特殊字符 btoa 报错：UTF8→Latin1兼容编码
function utf8ToBase64(str) {
  return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, function(match, p1) {
    return String.fromCharCode('0x' + p1);
  }));
}

function renderGitalk(){
  // 清理旧容器，防止多次渲染
  let old = document.getElementById('gitalk-container');
  if(old) old.remove();

  const content = document.querySelector('.content');
  const div = document.createElement('div');
  div.id = 'gitalk-container';
  div.style.marginTop = '60px';
  content.appendChild(div);

  // 获取页面路由
  let rawId = location.hash || '#/';
  // 编码，规避中文、特殊字符，同时截断控制长度
  let pageId = utf8ToBase64(rawId);
  // Gitalk id 最大50字符，强制截断
  if(pageId.length > 50) {
    pageId = pageId.slice(0,50);
  }

  const gitalk = new Gitalk({
    clientID: '你的ClientID',
    clientSecret: '你的ClientSecret',
    repo: '你的仓库名',
    owner: '你的Github用户名',
    admin: ['你的Github用户名'],
    id: pageId,
    distractionFreeMode: false
  });
  gitalk.render('gitalk-container');
}

// Docsify页面切换完成触发渲染（优于window.load）
window.$docsify.plugins = [
  function(hook){
    hook.doneEach(function(){
      renderGitalk();
    });
  }
];
</script>

// Docsify渲染完成再初始化（比window.load更可靠）
window.$docsify.plugins = [
  function(hook){
    hook.doneEach(function(){
      renderGitalk();
    });
  }
];
</script>
  
  <!-- 手写明暗切换逻辑，无第三方插件、永不消失 -->
  <script>
    (function(){
      const btn = document.getElementById('modeBtn');
      const html = document.documentElement;
      // 读取本地存储
      let mode = localStorage.getItem('site-theme');
      if(mode === 'dark'){
        html.classList.add('dark');
        btn.innerText = '☀️ 浅色模式';
      }
      btn.onclick = function(){
        if(html.classList.contains('dark')){
          html.classList.remove('dark');
          localStorage.setItem('site-theme','light');
          btn.innerText = '🌙 深色模式';
        }else{
          html.classList.add('dark');
          localStorage.setItem('site-theme','dark');
          btn.innerText = '☀️ 浅色模式';
        }
      }
    })();
  </script>
</body>
</html>
