<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文档站点</title>
  <!-- 默认主题 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <!-- 置顶导航插件CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-navbar-fixed@0.1.2/dist/navbar.css">
  <!-- 暗色模式 锁定稳定版本 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-dark-mode@0.8.2/dist/style.min.css">
</head>
<body>
  <div id="app"></div>

  <script>
    window.$docsify = {
      name: '项目文档',
      repo: '',
      loadSidebar: true,
      loadNavbar: true,
      subMaxLevel: 0,
      cache: false,
      search: {
        placeholder: '搜索文档'
      }
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <!-- 暗色模式JS（优先加载） -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-dark-mode@0.8.2/dist/index.min.js"></script>
  <!-- 置顶导航插件JS -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-navbar-fixed@0.1.2/dist/navbar.js"></script>
</body>
</html>
