<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文档站点</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4.13.0/lib/themes/vue.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-navbar-fixed@0.1.2/dist/navbar.css">
  <!-- themeable 样式 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css">
</head>
<body>
  <div id="app"></div>

  <script>
    window.$docsify = {
      name: '项目文档',
      repo: '',
      loadSidebar: true,
      loadNavbar: true,
      subMaxLevel: 0,
      cache: false,
      search: {
        placeholder: '搜索文档'
      }
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.0/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.0/lib/plugins/search.min.js"></script>
  <!-- 主题切换插件 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/js/docsify-themeable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-navbar-fixed@0.1.2/dist/navbar.js"></script>
</body>
</html>
