<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 放在head内 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-navbar-fixed/dist/navbar.css">
  <title>文档站点</title>
  <!-- 默认主题样式先加载 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
</head>
<body>
  <div id="app"></div>

  <!-- 【第一步】先定义配置！！ -->
  <script>
    window.$docsify = {
      name: '项目文档',
      repo: '',
      loadSidebar: true,
      loadNavbar: true,
      subMaxLevel: 3,
      search: {
        placeholder: '搜索文档'
      }
    }
  </script>

  <!-- 【第二步】再引入 docsify 核心JS -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <!-- 在docsify核心js之后引入 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-navbar-fixed/dist/navbar.js"></script>
</body>
</html>
